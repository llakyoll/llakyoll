<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity</title>
  <desc id="desc">Open Ahmed Akyol's live contribution history on GitHub.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#183b47"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="148" rx="14" fill="url(#bg)" stroke="#357b80" stroke-opacity=".7"/>
  <g fill="#58d6c2" opacity=".65">
    <rect x="36" y="37" width="13" height="13" rx="3"/><rect x="56" y="37" width="13" height="13" rx="3" opacity=".4"/>
    <rect x="36" y="57" width="13" height="13" rx="3" opacity=".3"/><rect x="56" y="57" width="13" height="13" rx="3"/>
    <rect x="76" y="57" width="13" height="13" rx="3" opacity=".5"/><rect x="36" y="77" width="13" height="13" rx="3" opacity=".5"/>
    <rect x="56" y="77" width="13" height="13" rx="3" opacity=".25"/><rect x="76" y="77" width="13" height="13" rx="3"/>
    <rect x="56" y="97" width="13" height="13" rx="3" opacity=".45"/><rect x="76" y="97" width="13" height="13" rx="3" opacity=".3"/>
  </g>
  <text x="116" y="67" fill="#f0f7f8" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Contribution activity</text>
  <text x="117" y="99" fill="#b4cbd1" font-family="Arial, Helvetica, sans-serif" font-size="17">Explore the live history on GitHub</text>
  <text x="839" y="88" fill="#58d6c2" font-family="Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle">↗</text>
</svg>
