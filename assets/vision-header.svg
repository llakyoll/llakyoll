<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">Ahmed Akyol — Computer Vision Engineer</title>
  <desc id="desc">A dark technical banner with a gently moving scan line and camera target.</desc>
  <style>
    .scan { animation: sweep 7s ease-in-out infinite alternate; }
    .pulse { animation: glow 3.5s ease-in-out infinite; }
    .pulse.two { animation-delay: 1.2s; }
    @keyframes sweep { from { transform: translateX(-170px); opacity: .15; } to { transform: translateX(730px); opacity: .7; } }
    @keyframes glow { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scan, .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142a3a"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#58d6c2" stop-opacity="0"/><stop offset=".5" stop-color="#58d6c2" stop-opacity=".45"/><stop offset="1" stop-color="#58d6c2" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#80b6ba" stroke-opacity=".12"/></pattern>
    <clipPath id="frame"><rect width="1000" height="270" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="270" fill="url(#bg)"/>
    <rect width="1000" height="270" fill="url(#grid)"/>
    <path d="M0 218H1000" stroke="#58d6c2" stroke-opacity=".25"/>
    <path d="M0 223H1000" stroke="#58d6c2" stroke-opacity=".1"/>
    <rect class="scan" x="170" width="170" height="270" fill="url(#beam)"/>
    <g fill="none" stroke="#58d6c2" stroke-opacity=".55" stroke-width="2">
      <circle cx="855" cy="128" r="66"/><circle cx="855" cy="128" r="38"/>
      <path d="M855 49v24m0 110v24M776 128h24m110 0h24"/>
      <path d="M760 57h28m-28 0v28m190-28h-28m28 0v28M760 199h28m-28 0v-28m190 28h-28m28 0v-28"/>
    </g>
    <circle class="pulse" cx="855" cy="128" r="6" fill="#58d6c2"/>
    <circle class="pulse two" cx="753" cy="188" r="3" fill="#58d6c2"/>
    <text x="56" y="67" fill="#58d6c2" font-family="monospace" font-size="16" letter-spacing="3">VISION / ENGINEERING</text>
    <text x="52" y="139" fill="#f0f7f8" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700">Ahmed Akyol</text>
    <text x="55" y="177" fill="#b4cbd1" font-family="Arial, Helvetica, sans-serif" font-size="20">From camera stream to production insight.</text>
    <text x="55" y="245" fill="#74aeb2" font-family="monospace" font-size="13" letter-spacing="2">DETECTION  /  TRACKING  /  EDGE AI</text>
  </g>
</svg>
